<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6bff" />
  <meta name="description" content="英语 B 级（PRETCO-B）备考工作台：六大题型专项练习 + 高频词汇背诵，支持学习进度保存与导入导出。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>英语 B 级 · 学习工作台</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-badge">B</span>
      <div class="brand-text">
        <h1>英语 B 级学习工作台</h1>
        <p class="subtitle">高等学校英语应用能力考试（B 级）· PRETCO-B 专项练习</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="export-btn" class="btn btn-ghost" title="导出学习进度为 JSON 文件">导出进度</button>
      <button id="import-btn" class="btn btn-ghost" title="从 JSON 文件导入学习进度">导入进度</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
      <button id="reset-btn" class="btn btn-ghost" title="清空所有学习进度">重置</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧：题型导航 -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="true" aria-controls="sidebar-body">
        <span>📚 练习模块与概览</span>
        <span class="st-arrow">▾</span>
      </button>
      <div class="sidebar-body" id="sidebar-body">
        <div class="sidebar-title">练习模块</div>
        <nav id="module-nav" class="module-nav"></nav>

        <div class="sidebar-title" style="margin-top: 20px;">学习概览</div>
        <div id="overview" class="overview"></div>
      </div>
    </aside>

    <!-- 右侧：主内容 -->
    <section class="content">
      <!-- 模式切换 -->
      <div class="mode-bar">
        <button class="mode-btn active" data-mode="practice">专项练习</button>
        <button class="mode-btn" data-mode="words">背单词</button>
        <button class="mode-btn" data-mode="review">错题本重练</button>
        <button class="mode-btn" data-mode="stats">进度统计</button>
      </div>

      <div id="practice-view" class="view"></div>
      <div id="words-view" class="view" hidden></div>
      <div id="review-view" class="view" hidden></div>
      <div id="stats-view" class="view" hidden></div>
    </section>
  </main>

  <footer class="app-footer">
    <span class="hide-mobile">仅用于 B 级备考自测 · </span>进度保存在本地浏览器，可用「导出 / 导入」跨设备迁移
  </footer>

  <button id="back-top" class="back-top" aria-label="回到顶部" hidden>↑</button>

  <div id="toast" class="toast" hidden></div>

  <script src="data/questions.js"></script>
  <script src="data/words.js"></script>
  <script src="data/presets.js"></script>
  <script src="js/wordstems.js"></script>
  <script src="js/morphology.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
